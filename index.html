<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Highway Rush | A game by Mandeep Singh</title>
<meta name="description" content="Highway Rush: weave through traffic, grab coins and nitro, and survive as the speed climbs.">
<style>
html,body{height:100%;margin:0;background:#070a14;color:#cbd5e1;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
canvas{width:min(100vw,calc(88vh*.625));width:min(100vw,calc(88svh*.625));aspect-ratio:5/8;height:auto;touch-action:none;border-radius:12px;box-shadow:0 0 0 1px #1e293b,0 20px 60px -20px #f59e0b;background:#14532d}
p{margin:0;font-size:.85rem;text-align:center;padding:0 1rem}
a{color:#fcd34d}
</style>
</head>
<body>
<canvas id="g" aria-label="Highway Rush racing game" tabindex="0"></canvas>
<p>Steer: left/right arrows, A/D, or drag. P pauses. <a href="../">Back to portfolio</a></p>
<script>
(function(){
var cv=document.getElementById('g'),ctx=cv.getContext('2d'),W=400,H=640,RL=40,LW=80,LN=4;
var d=Math.min(window.devicePixelRatio||1,2);cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);

var best=0;try{best=+localStorage.getItem('highwayrush_best')||0}catch(e){}
function saveBest(){try{localStorage.setItem('highwayrush_best',best)}catch(e){}}
function lx(i){return RL+LW*i+LW/2}
function rnd(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}

var COLORS=['#f43f5e','#f59e0b','#22d3ee','#a78bfa','#e5e7eb','#84cc16'];
var keys={},state='menu',score,bonus,coins,dist,t,S,base,nitroT,player,traffic,pickups,parts,floats,spawnT,coinT,nitroS,tx,shake,last=0;

function reset(){
  score=0;bonus=0;coins=0;dist=0;t=0;S=320;base=320;nitroT=0;tx=null;shake=0;
  player={x:lx(1),y:H-130,tilt:0};
  traffic=[];pickups=[];parts=[];floats=[];spawnT=.6;coinT=1.5;nitroS=rnd(12,18);
}
function start(){reset();state='play'}
function lanesBusy(){var o={},n=0;traffic.forEach(function(c){if(c.y<220){var l=Math.round((c.x-RL-LW/2)/LW);if(!o[l]){o[l]=1;n++}}});return{o:o,n:n}}
function crash(){
  state='over';shake=.4;
  for(var i=0;i<30;i++){var a=rnd(0,6.28),s=rnd(60,260);parts.push({x:player.x,y:player.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:.7,c:i%2?'#f59e0b':'#ef4444'})}
  if(score>best){best=score;saveBest()}
}

function update(dt){
  if(state==='menu'){dist+=180*dt}
  if(state==='over'){shake-=dt;for(var q=parts.length-1;q>=0;q--){var z=parts[q];z.x+=z.vx*dt;z.y+=z.vy*dt;z.l-=dt;if(z.l<=0)parts.splice(q,1)}}
  if(state!=='play')return;

  t+=dt;base=320+Math.min(t*7,300);nitroT=Math.max(0,nitroT-dt);shake-=dt;
  S=base+(nitroT>0?260:0);dist+=S*dt;

  var dx=(keys.arrowright||keys.d?1:0)-(keys.arrowleft||keys.a?1:0),px=player.x;
  if(dx){tx=null;player.x+=dx*300*dt}
  else if(tx!==null)player.x+=(tx-player.x)*Math.min(1,10*dt);
  player.x=clamp(player.x,RL+22,RL+LW*LN-22);
  player.tilt+=(clamp((player.x-px)/dt/300,-1,1)-player.tilt)*Math.min(1,12*dt);

  spawnT-=dt;
  if(spawnT<=0){
    var b=lanesBusy(),lane=Math.floor(Math.random()*LN);
    if(!b.o[lane]&&b.n<2){traffic.push({x:lx(lane),y:-90,v:rnd(130,240),c:COLORS[Math.floor(Math.random()*COLORS.length)],passed:false})}
    spawnT=Math.max(.3,.95-(base-320)/450)*rnd(.6,1.4);
  }
  coinT-=dt;
  if(coinT<=0){var cl=Math.floor(Math.random()*LN);for(var k=0;k<3;k++)pickups.push({x:lx(cl),y:-30-k*55,type:'c'});coinT=rnd(1.5,3)}
  nitroS-=dt;
  if(nitroS<=0){pickups.push({x:lx(Math.floor(Math.random()*LN)),y:-30,type:'n'});nitroS=rnd(14,22)}

  for(var i=traffic.length-1;i>=0;i--){
    var c=traffic[i];c.y+=(S-c.v)*dt;
    if(c.y>H+100){traffic.splice(i,1);continue}
    if(Math.abs(c.x-player.x)<34&&Math.abs(c.y-player.y)<66){crash();return}
    if(!c.passed&&c.y>player.y+38){
      c.passed=true;
      if(Math.abs(c.x-player.x)<58){bonus+=10;floats.push({x:player.x,y:player.y-50,t:'Close call +10',l:1})}
    }
  }
  for(i=pickups.length-1;i>=0;i--){
    var p=pickups[i];p.y+=S*dt;
    if(Math.hypot(p.x-player.x,p.y-player.y)<34){
      if(p.type==='c')coins++;else{nitroT=3.5;floats.push({x:player.x,y:player.y-50,t:'Nitro!',l:1})}
      pickups.splice(i,1);
    }else if(p.y>H+40)pickups.splice(i,1);
  }
  for(i=floats.length-1;i>=0;i--){var f=floats[i];f.y-=40*dt;f.l-=dt;if(f.l<=0)floats.splice(i,1)}
  score=Math.floor(dist/80)+coins*50+bonus;
}

function text(s,x,y,size,color,align,weight){
  ctx.font=(weight||600)+' '+size+'px system-ui,-apple-system,"Segoe UI",sans-serif';
  ctx.fillStyle=color;ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y);
}
function rr(x,y,w,h,r){ctx.beginPath();(ctx.roundRect||ctx.rect).call(ctx,x,y,w,h,r)}
function car(x,y,color,tilt,me){
  ctx.save();ctx.translate(x,y);ctx.rotate((tilt||0)*.14);
  ctx.fillStyle='rgba(0,0,0,.3)';rr(-18,-30,40,76,10);ctx.fill();
  ctx.fillStyle='#0f172a';
  [[-24,-26],[19,-26],[-24,14],[19,14]].forEach(function(w){ctx.fillRect(w[0],w[1],5,14)});
  ctx.fillStyle=color;rr(-20,-38,40,76,9);ctx.fill();
  if(me){ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(-3,-38,6,76)}
  ctx.fillStyle='#1e293b';rr(-14,-20,28,16,4);ctx.fill();rr(-14,14,28,10,3);ctx.fill();
  ctx.fillStyle='#fde68a';ctx.fillRect(-16,-38,8,4);ctx.fillRect(8,-38,8,4);
  ctx.fillStyle='#ef4444';ctx.fillRect(-16,34,8,4);ctx.fillRect(8,34,8,4);
  ctx.restore();
}
function panel(){ctx.fillStyle='rgba(7,10,20,.78)';ctx.fillRect(0,0,W,H)}

function draw(){
  ctx.save();
  if(shake>0)ctx.translate(rnd(-5,5),rnd(-5,5));
  ctx.fillStyle='#15803d';ctx.fillRect(-10,-10,W+20,H+20);
  var off=dist%160;ctx.fillStyle='#166534';
  for(var y=-160+off;y<H;y+=160){ctx.fillRect(0,y,RL,80);ctx.fillRect(RL+LW*LN,y,W-RL-LW*LN,80)}
  ctx.fillStyle='#2b3445';ctx.fillRect(RL,-10,LW*LN,H+20);
  ctx.fillStyle='#f8fafc';ctx.fillRect(RL-2,-10,4,H+20);ctx.fillRect(RL+LW*LN-2,-10,4,H+20);
  ctx.fillStyle='rgba(248,250,252,.7)';off=dist%80;
  for(var i=1;i<LN;i++)for(y=-80+off;y<H;y+=80)ctx.fillRect(RL+LW*i-2,y,4,40);
  if(nitroT>0){ctx.fillStyle='rgba(253,230,138,.5)';for(i=0;i<14;i++)ctx.fillRect(rnd(RL,RL+LW*LN),rnd(0,H),2,rnd(30,80))}

  pickups.forEach(function(p){
    if(p.type==='c'){ctx.fillStyle='#fbbf24';ctx.beginPath();ctx.arc(p.x,p.y,10,0,6.28);ctx.fill();ctx.fillStyle='#b45309';ctx.beginPath();ctx.arc(p.x,p.y,5,0,6.28);ctx.fill()}
    else{ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(p.x,p.y,16,0,6.28);ctx.fill();text('⚡',p.x,p.y+1,18,'#fff')}
  });
  traffic.forEach(function(c){car(c.x,c.y,c.c,0,false)});
  if(state!=='over'){
    if(nitroT>0){ctx.fillStyle='#f97316';ctx.beginPath();ctx.moveTo(player.x-10,player.y+38);ctx.lineTo(player.x,player.y+70+rnd(0,18));ctx.lineTo(player.x+10,player.y+38);ctx.fill()}
    car(player.x,player.y,'#3b82f6',player.tilt,true);
  }
  parts.forEach(function(p){ctx.globalAlpha=Math.max(0,p.l*1.5);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,6,6)});
  ctx.globalAlpha=1;
  floats.forEach(function(f){ctx.globalAlpha=Math.max(0,f.l);text(f.t,f.x,f.y,15,'#fde68a');});
  ctx.globalAlpha=1;
  ctx.restore();

  if(state==='play'||state==='pause'){
    text('Score '+score,14,24,19,'#f8fafc','left');
    text('Best '+best,W-14,24,16,'#cbd5e1','right');
    text(Math.round(S*.3)+' km/h',14,50,15,'#fcd34d','left');
    text('Coins '+coins,W-14,48,15,'#fbbf24','right');
    if(nitroT>0){ctx.fillStyle='#38bdf8';ctx.fillRect(W/2-50,14,100*nitroT/3.5,6)}
  }
  if(state==='menu'){
    panel();car(W/2,170,'#3b82f6',0,true);
    text('Highway Rush',W/2,265,40,'#f8fafc',null,800);
    text('Weave through traffic as the speed climbs.',W/2,310,16,'#cbd5e1');
    text('Collect coins and grab ⚡ for a nitro boost.',W/2,336,16,'#cbd5e1');
    text('Near misses earn bonus points.',W/2,362,16,'#cbd5e1');
    text('Tap or press Space to start',W/2,440,21,'#fcd34d');
  }else if(state==='pause'){
    panel();text('Paused',W/2,H/2-10,38,'#f8fafc',null,800);text('Tap or press P to resume',W/2,H/2+32,17,'#cbd5e1');
  }else if(state==='over'){
    panel();
    text('Crashed!',W/2,190,42,'#f87171',null,800);
    text('Score '+score,W/2,258,28,'#f8fafc');
    text(score>=best&&score>0?'New best score!':'Best '+best,W/2,298,18,'#fbbf24');
    text(coins+' coins, '+Math.round(S*.3)+' km/h top speed',W/2,330,15,'#94a3b8');
    text('Tap or press Enter to race again',W/2,410,21,'#fcd34d');
  }
}

function frame(ts){
  var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);draw();requestAnimationFrame(frame);
}
function setTarget(e){var r=cv.getBoundingClientRect();tx=(e.clientX-r.left)*W/r.width}
function togglePause(){if(state==='play')state='pause';else if(state==='pause')state='play'}

window.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();keys[k]=true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].indexOf(k)>-1)e.preventDefault();
  if((k===' '||k==='enter')&&(state==='menu'||state==='over'))start();
  else if(k==='p'||k==='escape')togglePause();
});
window.addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=false});
cv.addEventListener('pointerdown',function(e){
  if(state==='menu'||state==='over')start();
  else if(state==='pause')state='play';
  setTarget(e);
});
cv.addEventListener('pointermove',function(e){if(state==='play'&&(e.pointerType!=='touch'||e.buttons))setTarget(e)});
document.addEventListener('visibilitychange',function(){if(document.hidden&&state==='play')state='pause'});
window.addEventListener('blur',function(){if(state==='play')state='pause'});

reset();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
